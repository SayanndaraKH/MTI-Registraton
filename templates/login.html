<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ចូលគណនី (Login & Sign Up) - MTI Academy</title>
  <link rel="stylesheet" href="/static/css/style.css?v=3.0">
</head>
<body>
  <main style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem;">
    <div style="width:100%; max-width:440px; background:var(--bg-card); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:2.5rem 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">

      <div style="text-align:center; margin-bottom:1.75rem;">
        <img src="/static/uploads/mti_logo.png" alt="MTI Academy Logo" style="width: 105px; height: 105px; border-radius: 50%; object-fit: cover; filter: drop-shadow(0 6px 20px rgba(217, 119, 6, 0.4)); margin-bottom: 0.5rem; background: transparent;">
        <h1 style="font-size:1.5rem; font-weight:800; color:#fff; margin-top:0.25rem;">
          MTI Academy
        </h1>
        <p style="color:var(--text-muted); font-size:0.9rem; margin-top:0.35rem;">
          ចូលគណនី ឬ ចុះឈ្មោះ (Login & Sign Up)
        </p>
      </div>

      {% if error %}
      <div style="background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.4); color:#fca5a5; border-radius:var(--radius-md); padding:0.9rem 1rem; font-size:0.87rem; margin-bottom:1.25rem; line-height:1.5;">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/login" novalidate>
        <input type="hidden" name="next" value="{{ next }}">

        <div class="form-group">
          <label class="form-label" for="username">📧 Google Email / 👤 ADMIN *</label>
          <input type="text" id="username" name="username" class="form-input" placeholder="ឧ. name@gmail.com ឬ ADMIN" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">🔒 លេខសម្ងាត់ (Password) *</label>
          <div style="position: relative; display: flex; align-items: center;">
            <input type="password" id="password" name="password" class="form-input" placeholder="វាយលេខសម្ងាត់របស់អ្នក" required autocomplete="current-password" style="padding-right: 2.75rem;">
            <button type="button" id="togglePasswordBtn" onclick="togglePasswordVisibility()" style="position: absolute; right: 0.6rem; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #fff; cursor: pointer; font-size: 1.05rem; padding: 0.25rem 0.5rem; border-radius: 6px; display: flex; align-items: center; justify-content: center;" title="បង្ហាញ / លាក់លេខសម្ងាត់ (Show / Hide Password)">
              👁️
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="full_name">📝 ឈ្មោះពេញ (Full Name - សម្រាប់សិស្សថ្មី)</label>
          <input type="text" id="full_name" name="full_name" class="form-input" placeholder="ឧ. សុខ ចាន់ (Sok Chan)">
        </div>

        <div class="form-group">
          <label class="form-label" for="phone_number">📞 លេខទូរស័ព្ទ (Phone Number - សម្រាប់សិស្សថ្មី)</label>
          <input type="tel" id="phone_number" name="phone_number" class="form-input" placeholder="ឧ. 012 345 678">
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.75rem; padding:0.85rem; font-weight:700; font-size:1rem;">
          🚀 ចូលគណនី / ចុះឈ្មោះ (Sign In / Sign Up)
        </button>
      </form>

      <p style="color:var(--text-muted); font-size:0.8rem; text-align:center; margin-top:1.5rem; line-height:1.6;">
        🛡️ សុវត្ថិភាព ៖ ប្រសិនបើបញ្ចូលលេខសម្ងាត់ខុស <strong>៥ ដង</strong> ប្រព័ន្ធនឹងបិទការចូល <strong>២ ម៉ោង</strong> ដោយស្វ័យប្រវត្តិ។
      </p>
    </div>
  </main>

  <script>
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const toggleBtn = document.getElementById('togglePasswordBtn');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        toggleBtn.innerHTML = '🙈';
        toggleBtn.title = 'លាក់លេខសម្ងាត់ (Hide Password)';
      } else {
        pwdInput.type = 'password';
        toggleBtn.innerHTML = '👁️';
        toggleBtn.title = 'បង្ហាញលេខសម្ងាត់ (Show Password)';
      }
    }
  </script>
</body>
</html>
